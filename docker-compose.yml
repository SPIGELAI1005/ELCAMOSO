services:
  postgres:
    image: postgres:16-alpine
    container_name: elcamoso-postgres-dev
    environment:
      POSTGRES_USER: elcamoso
      POSTGRES_PASSWORD: elcamoso_dev
      POSTGRES_DB: elcamoso_dev
    ports:
      - "5432:5432"
    volumes:
      - elcamoso_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elcamoso -d elcamoso_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  elcamoso_pg_data:
